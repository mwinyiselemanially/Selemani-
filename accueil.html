<script>
"use strict";

/* 1. CONFIGURATION SUPABASE (identifiants conservés) */
const SUPABASE_URL = "https://cgihcctpedkaessouozs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_osaXxcflmQjkyDXrQOJqPA_6xFkQI-Q";

const $ = id => document.getElementById(id);
const filPublications = $("filPublications");

/* Si la bibliothèque Supabase n'a pas pu se charger, on le dit clairement */
if (!window.supabase) {
    filPublications.replaceChildren(creerEtatSimple(
        "La bibliothèque Supabase n'a pas pu se charger.\n\nVérifie ta connexion ou désactive ton bloqueur de pubs, puis recharge."
    ));
    throw new Error("supabase-js non chargé");
}

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let utilisateurActuel = null;
let publicationsEnCours = false;
let pubCommentee = null;
let urlApercu = null;
let observateur = null;

const formulairePublication = $("formulairePublication");
const contenuPublication = $("contenuPublication");
const fichierMedia = $("fichierMedia");
const apercuFichier = $("apercuFichier");
const boutonPublier = $("boutonPublier");

/* 2. OUTILS */
function creerElement(tag, classe, texte = "") {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texte !== "") e.textContent = texte;
    return e;
}
function creerEtatSimple(texte) { return creerElement("div", "etat", texte); }
function afficherMessage(id, texte, type = "info") {
    const e = $(id); e.textContent = texte; e.className = "message " + type;
}
function masquerMessage(id) {
    const e = $(id); e.textContent = ""; e.className = "message";
}
function formaterDate(v) {
    if (!v) return "";
    const d = new Date(v);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
}
function nomDepuisUtilisateur() {
    if (!utilisateurActuel) return "Utilisateur";
    const m = utilisateurActuel.user_metadata || {};
    return m.full_name || m.name || m.nom || m.nom_complet ||
        (utilisateurActuel.email ? utilisateurActuel.email.split("@")[0] : "Utilisateur");
}
function nomAffiche(nom) {
    const p = String(nom || "Utilisateur").trim();
    return p.startsWith("@") ? p : "@" + p;
}

/* DIAGNOSTIC RÉSEAU : explique pourquoi "Failed to fetch" */
async function lancerDiagnostic() {
    const lignes = [];
    lignes.push("Internet : " + (navigator.onLine ? "oui" : "NON (hors ligne)"));
    lignes.push("Page : " + location.protocol + "//" + location.host);
    lignes.push("Clé : " + SUPABASE_ANON_KEY.slice(0, 15) + "… (" + SUPABASE_ANON_KEY.length + " car.)");
    const tests = [
        ["Serveur Auth", SUPABASE_URL + "/auth/v1/health"],
        ["API Données", SUPABASE_URL + "/rest/v1/publications?select=id&limit=1"]
    ];
    for (const [nom, url] of tests) {
        try {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 8000);
            const r = await fetch(url, {
                headers: { apikey: SUPABASE_ANON_KEY },
                signal: c.signal
            });
            clearTimeout(t);
            const corps = (await r.text()).slice(0, 160);
            lignes.push(nom + " : HTTP " + r.status + " " + corps);
        } catch (e) {
            lignes.push(nom + " : ÉCHEC (" + (e.name === "AbortError" ? "délai dépassé" : e.message) + ")");
        }
    }
    try {
        const { data: s } = await supabaseClient.auth.getSession();
        const sess = s && s.session;
        lignes.push("Session : " + (sess ? "oui, expire " + new Date(sess.expires_at * 1000).toLocaleString("fr-FR") : "NON"));
        if (sess) {
            lignes.push("Taille du jeton : " + sess.access_token.length + " caractères (normal : environ 800 à 1500)");
            const meta = (sess.user && sess.user.user_metadata) || {};
            const tailles = Object.keys(meta).map(k => k + "=" + JSON.stringify(meta[k]).length);
            lignes.push("Métadonnées utilisateur : " + (tailles.join(", ") || "vide"));
            try {
                const r = await fetch(SUPABASE_URL + "/rest/v1/publications?select=id&limit=1", {
                    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + sess.access_token }
                });
                lignes.push("Données + jeton session : HTTP " + r.status + " " + (await r.text()).slice(0, 120));
            } catch (e) {
                lignes.push("Données + jeton session : ÉCHEC (" + e.message + ")");
            }
        }
    } catch (e) {
        lignes.push("Session : erreur (" + e.message + ")");
    }
    const essais = [
        ["Client select id", () => supabaseClient.from("publications").select("id").limit(1)],
        ["Client select *", () => supabaseClient.from("publications").select("*").limit(1)],
        ["Client select * + tri", () => supabaseClient.from("publications").select("*").order("created_at", { ascending: false }).limit(50)]
    ];
    for (const [nom, f] of essais) {
        try {
            const r = await f();
            lignes.push(nom + " : " + (r.error ? "ERREUR " + r.error.message : "OK (" + (r.data || []).length + " lignes)"));
        } catch (e) {
            lignes.push(nom + " : ÉCHEC (" + e.message + ")");
        }
    }
    return lignes.join("\n");
}

let profils = {};

let ongletFil = "pourtoi";

async function chargerProfils(ids) {
    const manquants = ids.filter(i => i && !profils[i]);
    if (!manquants.length) return;
    const { data, error } = await supabaseClient.from("profils")
        .select("id,nom_utilisateur,photo_profil,biographie").in("id", manquants);
    if (error) { console.warn("Profils :", error.message); return; }
    (data || []).forEach(p => { profils[p.id] = p; });
}
function nomPublic(id, defaut) {
    const p = profils[id];
    return p && p.nom_utilisateur ? "@" + p.nom_utilisateur : defaut;
}
function lienPhoto(v) { return typeof v === "string" && /^https?:\/\//i.test(v) ? v : ""; }
function remplirAvatar(div, id, nom) {
    div.replaceChildren();
    const url = lienPhoto(profils[id] && profils[id].photo_profil);
    const lettre = (String(nom || "U").replace(/^@/, "").trim().charAt(0) || "U").toUpperCase();
    if (url) {
        const img = document.createElement("img");
        img.src = url; img.alt = "";
        img.onerror = () => { div.textContent = lettre; };
        div.appendChild(img);
    } else {
        div.textContent = lettre;
    }
}

async function chargerMesAbonnements() {
    abonnes = new Set();
    const { data, error } = await supabaseClient.from("abonnements")
        .select("suivi_id").eq("abonne_id", utilisateurActuel.id);
    if (error) {
        console.warn("Abonnements :", error.message);
        const copie = CacheSelemani.get("abonnes");
        if (copie) abonnes = new Set(copie.d);
        return;
    }
    (data || []).forEach(a => abonnes.add(a.suivi_id));

// Suivre / ne plus suivre. Retourne true si on suit maintenant ce profil.
async function basculerSuivre(id) {
    if (!utilisateurActuel || id === utilisateurActuel.id) return abonnes.has(id);
    const suit = abonnes.has(id);
    const { error } = suit
        ? await supabaseClient.from("abonnements").delete().eq("abonne_id", utilisateurActuel.id).eq("suivi_id", id)
        : await supabaseClient.from("abonnements").insert({ abonne_id: utilisateurActuel.id, suivi_id: id });
    if (error && error.code !== "23505") {
        afficherMessage("messageFil", "Abonnement impossible : " + error.message, "erreur");
        setTimeout(() => masquerMessage("messageFil"), 4000);
        return suit;
    }
    if (suit) abonnes.delete(id); else abonnes.add(id);
    majBadgesSuivre(id);
    return !suit;
}

// Fenêtre de profil : photo, bio, statistiques, suivre, voir le profil, message.
async function ouvrirProfil(id) {
    if (!id) return;
    ouvrirFeuille("feuilleProfil");
    const z = $("contenuProfil");
    z.replaceChildren(creerElement("div", "vide", "Chargement..."));
    try {
        await chargerProfils([id]);
        const [a, s, p] = await Promise.all([
            supabaseClient.from("abonnements").select("abonne_id", { count: "exact", head: true }).eq("suivi_id", id),
            supabaseClient.from("abonnements").select("suivi_id", { count: "exact", head: true }).eq("abonne_id", id),
            supabaseClient.from("publications").select("id", { count: "exact", head: true }).eq("user_id", id)
        ]);
        const moi = Boolean(utilisateurActuel && id === utilisateurActuel.id);
        const nom = nomPublic(id, "Utilisateur");
        const prof = profils[id] || {};

        const tete = creerElement("div", "pf-tete");
        const av = creerElement("div", "av pf-av");
        remplirAvatar(av, id, nom);
        tete.append(av, creerElement("div", "pf-nom", nom),
            creerElement("div", "pf-bio", prof.biographie || "Aucune biographie pour le moment."));

        const stats = creerElement("div", "pf-stats");
        let nbAbonnes = null;
        [[a.count || 0, "Abonnés"], [s.count || 0, "Abonnements"], [p.count || 0, "Posts"]].forEach(([n, l], i) => {
            const c = creerElement("div", "pf-st");
            const b = creerElement("b", "", String(n));
            if (i === 0) nbAbonnes = b;
            c.append(b, creerElement("span", "", l));
            stats.appendChild(c);
        });

        const act = creerElement("div", "pf-act");
        if (!moi && utilisateurActuel) {
            const bs = creerElement("button", abonnes.has(id) ? "btn2" : "btn", abonnes.has(id) ? "Abonné ✓" : "+ Suivre");
            bs.type = "button";
            bs.addEventListener("click", async () => {
                bs.disabled = true;
                const avant = abonnes.has(id);
                const suit = await basculerSuivre(id);
                bs.textContent = suit ? "Abonné ✓" : "+ Suivre";
                bs.className = suit ? "btn2" : "btn";
                if (suit !== avant) nbAbonnes.textContent = String(Math.max(0, Number(nbAbonnes.textContent) + (suit ? 1 : -1)));
                bs.disabled = false;
            });
            act.appendChild(bs);
        }
        const voir = creerElement("a", "btn2", moi ? "Voir mon profil" : "Voir le profil");
        voir.href = moi ? "profil.html" : "profil.html?id=" + encodeURIComponent(id);
        act.appendChild(voir);
        if (!moi && utilisateurActuel) {
            const msg = creerElement("a", "btn2", "✉ Message");
            msg.href = "messages.html?id=" + encodeURIComponent(id);
            act.appendChild(msg);
        }
        if (!moi && utilisateurActuel) {
            const sig = creerElement("button", "btn2", "⚑ Signaler");
            sig.type = "button";
            sig.addEventListener("click", () => { fermerFeuilles(); ouvrirSignalement("utilisateur", id, "Signaler le profil " + nom); });
            const blq = creerElement("button", "btn2", bloques.has(id) ? "Débloquer" : "🚫 Bloquer");
            blq.type = "button";
            blq.addEventListener("click", async () => {
                if (bloques.has(id)) { await debloquer(id); fermerFeuilles(); return; }
                if (!confirm("Bloquer " + nom + " ? Tu ne verras plus ses publications ni ses commentaires.")) return;
                if (await bloquer(id)) fermerFeuilles();
            });
            act.append(sig, blq);
        }
        z.replaceChildren(tete, stats, act);
    } catch (e) {
        console.error("Erreur profil :", e);
        z.replaceChildren(creerElement("div", "vide", "Impossible de charger le profil : " + e.message));
    }
}

// Enregistrer / retirer une publication des favoris. Retourne true si elle est enregistrée.
async function basculerFavori(id) {
    const avait = favoris.has(id);
    const { error } = avait
        ? await supabaseClient.from("favoris").delete().eq("user_id", utilisateurActuel.id).eq("publication_id", id)
        : await supabaseClient.from("favoris").insert({ user_id: utilisateurActuel.id, publication_id: id });
    if (error && error.code !== "23505") {
        toast("Favori impossible : " + error.message, "erreur");
        return avait;
    }
    if (avait) favoris.delete(id); else favoris.add(id);
    CacheSelemani.set("favoris", [...favoris]);
    return !avait;
}

async function bloquer(id) {
    const { error } = await supabaseClient.from("blocages").insert({ bloqueur_id: utilisateurActuel.id, bloque_id: id });

/* 5. SESSION */
async function verifierSession() {
    let session = null, erreur = null;
    try {
        const r = await supabaseClient.auth.getSession();
        session = r.data && r.data.session;
        erreur = r.error;
    } catch (e) { erreur = e; }

    // Hors ligne : on utilise la session enregistrée pour afficher le contenu sauvegardé.
    if (erreur && CacheSelemani.horsLigne(erreur)) {
        const local = CacheSelemani.utilisateurLocal();
        if (local) { utilisateurActuel = local; CacheSelemani.init(local.id); return true; }
    }
    if (erreur) {
        afficherMessage("messageFil", "Erreur de session : " + erreur.message, "erreur");
        return false;
    }
    utilisateurActuel = session ? session.user : null;
    if (!utilisateurActuel) {
        window.location.replace("connexion.html");
        return false;
    }
    CacheSelemani.init(utilisateurActuel.id);
    return true;
}

/* 6. APERÇU */
fichierMedia.addEventListener("change", function () {
    const fichier = fichierMedia.files[0];
    if (urlApercu) { URL.revokeObjectURL(urlApercu); urlApercu = null; }
    apercuFichier.replaceChildren();
    apercuFichier.style.display = "none";
    masquerMessage("messagePublication");
    if (!fichier) return;
    const estImage = fichier.type.startsWith("image/");
    const estVideo = fichier.type.startsWith("video/");
    if (!estImage && !estVideo) {
        fichierMedia.value = "";
        afficherMessage("messagePublication", "Choisis une image ou une vidéo valide.", "erreur");
        return;
    }
    if (fichier.size > 50 * 1024 * 1024) {
        fichierMedia.value = "";
        afficherMessage("messagePublication", "Le fichier dépasse la limite de 50 Mo.", "erreur");
        return;
    }
    urlApercu = URL.createObjectURL(fichier);
    const media = document.createElement(estImage ? "img" : "video");
    media.src = urlApercu;
    if (estVideo) { media.muted = true; media.playsInline = true; media.controls = true; }
    apercuFichier.append(media, document.createTextNode("Fichier sélectionné : " + fichier.name));
    apercuFichier.style.display = "block";
});

/* 7. ENVOI MÉDIA */
async function envoyerMedia(fichier) {
    if (!fichier) return { url: null, type: null };
    const type = fichier.type.startsWith("video/") ? "video" : "image";
    const extension = fichier.name.includes(".") ? fichier.name.split(".").pop().toLowerCase() : "bin";
    const id = typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : Date.now() + "_" + Math.random().toString(36).slice(2);
    const nomFichier = utilisateurActuel.id + "/" + Date.now() + "_" + id + "." + extension;
    const { error } = await supabaseClient.storage.from("publications").upload(nomFichier, fichier, {
        cacheControl: "3600", upsert: false, contentType: fichier.type
    });
    if (error) throw new Error("Envoi du média impossible : " + error.message);
    const { data } = supabaseClient.storage.from("publications").getPublicUrl(nomFichier);
    return { url: data.publicUrl, type };
}

/* 8. PUBLIER */
formulairePublication.addEventListener("submit", async function (event) {
    event.preventDefault();
    masquerMessage("messagePublication");
    if (!utilisateurActuel) {
        afficherMessage("messagePublication", "Ta session n'est pas disponible. Reconnecte-toi.", "erreur");
        return;
    }
    const texte = contenuPublication.value.trim();
    const fichier = fichierMedia.files[0];
    if (!texte && !fichier) {
        afficherMessage("messagePublication", "Écris un texte ou sélectionne une photo/vidéo.", "erreur");
        return;
    }
    if (fichier && fichier.size > 50 * 1024 * 1024) {
        afficherMessage("messagePublication", "La taille maximale autorisée est de 50 Mo.", "erreur");
        return;
    }
    boutonPublier.disabled = true;
    boutonPublier.textContent = "Publication...";
    try {
        let media = { url: null, type: null };
        if (fichier) media = await envoyerMedia(fichier);
        const { error } = await supabaseClient.from("publications").insert([{
            user_id: utilisateurActuel.id,
            nom_auteur: nomDepuisUtilisateur(),
            contenu: texte,
            media_url: media.url,
            media_type: media.type
        }]);
        if (error) throw new Error(error.message);
        contenuPublication.value = "";
        fichierMedia.value = "";
        if (urlApercu) { URL.revokeObjectURL(urlApercu); urlApercu = null; }
        apercuFichier.replaceChildren();
        apercuFichier.style.display = "none";
        fermerFeuilles();
        await chargerPublications();
        filPublications.scrollTo({ top: 0, behavior: "smooth" });
        afficherMessage("messageFil", "Publication publiée avec succès ! 🚀", "succes");
        setTimeout(() => masquerMessage("messageFil"), 3000);
    } catch (error) {
        console.error("Erreur publication :", error);
        afficherMessage("messagePublication", "Impossible de publier : " + error.message, "erreur");
    } finally {
        boutonPublier.disabled = false;
        boutonPublier.textContent = "Publier";
    }
});

/* 9. CHARGER LES PUBLICATIONS */
async function chargerPublications() {
    if (publicationsEnCours) return;
    publicationsEnCours = true;
    filPublications.replaceChildren(creerElement("div", "etat chargement", "Chargement des publications..."));
    try {
        let requete = supabaseClient.from("publications").select("*");
        if (ongletFil === "abonnes") {
            const suivis = [...abonnes];
            if (!suivis.length) {
                filPublications.replaceChildren(creerEtatSimple(
                    "Tu ne suis personne pour le moment.\n\nSuis des profils depuis « Pour toi » pour voir leurs publications ici."));
                masquerMessage("messageFil");
                return;
            }
            requete = requete.in("user_id", suivis);
        }
        const { data: publicationsBrutes, error } = await requete
            .order("created_at", { ascending: false }).limit(50);
        if (error) throw new Error(error.message);
        const publications = (publicationsBrutes || []).filter(pb => !bloques.has(pb.user_id));
        await chargerProfils([...new Set((publications || []).map(pb => pb.user_id))]);

        filPublications.replaceChildren();
        if (!publications || publications.length === 0) {
            filPublications.appendChild(creerEtatSimple(
                "Bienvenue dans SELEMANI 2900 🚀\n\nAucune publication pour le moment.\nSois le premier à partager quelque chose !"));
            masquerMessage("messageFil");
            return;
        }

        const ids = publications.map(p => p.id);
        const stats = {};
        ids.forEach(id => { stats[id] = { likes: 0, commentaires: 0, aime: false }; });

        const [rL, rC] = await Promise.all([
            supabaseClient.from("likes").select("publication_id, user_id").in("publication_id", ids),
            supabaseClient.from("commentaires").select("publication_id").in("publication_id", ids)
        ]);
        if (rL.error) console.warn("Likes :", rL.error.message);
        if (rC.error) console.warn("Commentaires :", rC.error.message);

        (rL.data || []).forEach(l => {
            const s = stats[l.publication_id];
            if (!s) return;
            s.likes++;
            if (l.user_id === utilisateurActuel.id) s.aime = true;
        });
        (rC.data || []).forEach(c => {
            const s = stats[c.publication_id];
            if (s) s.commentaires++;
        });

        CacheSelemani.set("fil_" + ongletFil, {
            publications,
            stats,
            profils: Object.fromEntries([...new Set(publications.map(pb => pb.user_id))].map(i => [i, profils[i]]).filter(x => x[1]))
        });
        publications.forEach(p => filPublications.appendChild(creerCartePublication(p, stats[p.id])));
        observerVideos();
        masquerMessage("messageFil");
    } catch (error) {
        console.error("Erreur chargement :", error);
        const copie = CacheSelemani.horsLigne(error) ? CacheSelemani.get("fil_" + ongletFil) : null;
        if (copie) {
            rendreCopie(copie.d);
            afficherMessage("messageFil", "Hors ligne : contenu enregistré le " + CacheSelemani.dateTexte(copie.t) + ".", "info");
            return;
        }
        const etat = creerEtatSimple("Impossible de charger les publications.");
        const diag = creerElement("div", "diag", "Diagnostic en cours...");
        const bloc = creerElement("div", "");
        bloc.append(etat, diag);
        etat.style.minHeight = "auto";
        etat.style.padding = "90px 20px 0";
        filPublications.replaceChildren(bloc);
        afficherMessage("messageFil", "Erreur Supabase : " + error.message, "erreur");
        lancerDiagnostic().then(t => { diag.textContent = t; });
    } finally {
        publicationsEnCours = false;
    }
}

// Affiche le dernier fil enregistré (mode hors ligne).
function rendreCopie(c) {
    Object.assign(profils, c.profils || {});
    filPublications.replaceChildren();
    (c.publications || []).forEach(p => {
        const st = (c.stats && c.stats[p.id]) || { likes: 0, commentaires: 0, aime: false };
        filPublications.appendChild(creerCartePublication(p, st));
    });
    if (!filPublications.children.length) filPublications.appendChild(creerEtatSimple("Aucune publication enregistrée."));
    observerVideos();
}

// Dès que la connexion revient, on recharge le fil.
window.addEventListener("online", () => { if (utilisateurActuel) chargerPublications(); });

/* 10. LECTURE AUTO DES VIDÉOS */
function observerVideos() {
    if (observateur) observateur.disconnect();
    if (!("IntersectionObserver" in window)) return;
    observateur = new IntersectionObserver(entrees => {
        entrees.forEach(e => {
            const v = e.target.querySelector("video.media");
            if (!v) return;
            if (e.isIntersecting) v.play().catch(() => {});
            else v.pause();
        });
    }, { root: filPublications, threshold: 0.65 });
    filPublications.querySelectorAll(".slide").forEach(s => observateur.observe(s));
}

/* 11. CARTE DE PUBLICATION */
function creerCartePublication(publication, stats) {
    const slide = creerElement("article", "slide");
    slide.id = "publication-" + publication.id;
    slide.dataset.postId = publication.id;
    slide.dataset.auteur = publication.user_id;
    const auteurNom = publication.nom_auteur || "Utilisateur";
    let aime = stats.aime, nbLikes = stats.likes, nbCommentaires = stats.commentaires;
    const like = creerBoutonAction("coeur", nbLikes);
    const commentaire = creerBoutonAction("bulle", nbCommentaires);
    const partage = creerBoutonAction("envoi", "Partager");
    const favori = creerBoutonAction("bookmark", "Favori");
    favori.b.classList.toggle("sauve", favoris.has(publication.id));
    favori.b.addEventListener("click", async () => {
        favori.b.disabled = true;
        const sauve = await basculerFavori(publication.id);
        favori.b.classList.toggle("sauve", sauve);
        favori.b.disabled = false;
        if (sauve) toast("Publication enregistrée dans tes favoris.", "succes");
    });
    like.b.classList.toggle("aime", aime);
    const coeurAnime = creerElement("div", "coeur", "❤️");

    async function basculerLike() {
        if (like.b.disabled || !utilisateurActuel) return;
        like.b.disabled = true;
        const ancienEtat = aime, ancienNombre = nbLikes;
        aime = !ancienEtat;
        nbLikes = Math.max(0, ancienNombre + (aime ? 1 : -1));
        like.b.classList.toggle("aime", aime);
        like.n.textContent = String(nbLikes);
        try {
            let r;
            if (aime) {
                r = await supabaseClient.from("likes").insert([{ publication_id: publication.id, user_id: utilisateurActuel.id }]);
            } else {
                r = await supabaseClient.from("likes").delete()
                    .eq("publication_id", publication.id).eq("user_id", utilisateurActuel.id);
            }
            if (r.error) throw new Error(r.error.message);
        } catch (error) {
            aime = ancienEtat; nbLikes = ancienNombre;
            like.b.classList.toggle("aime", aime);
            like.n.textContent = String(nbLikes);
            console.error("Erreur like :", error);
            afficherMessage("messageFil", "Impossible de modifier le like : " + error.message, "erreur");
            setTimeout(() => masquerMessage("messageFil"), 4000);
        } finally {
            like.b.disabled = false;
        }
    }
    like.b.addEventListener("click", basculerLike);

    if (publication.media_url) {
        const estVideo = publication.media_type === "video";
        const media = document.createElement(estVideo ? "video" : "img");
        media.className = "media";
        media.src = publication.media_url;
        if (estVideo) {
            media.loop = true; media.muted = true; media.playsInline = true; media.preload = "metadata";
            const boutonSon = creerElement("button", "son", "🔇");
            boutonSon.type = "button";
            boutonSon.setAttribute("aria-label", "Activer ou couper le son");
            boutonSon.addEventListener("click", () => {
                media.muted = !media.muted;
                boutonSon.textContent = media.muted ? "🔇" : "🔊";
            });
            slide.append(media, boutonSon);
        } else {
            media.alt = "Photo publiée sur SELEMANI";
            media.loading = "lazy";
            slide.appendChild(media);
        }
        slide.appendChild(creerElement("div", "voile"));
    } else {
        slide.classList.add("txt");
        slide.appendChild(creerElement("div", "gros", publication.contenu || ""));
    }

    slide.addEventListener("dblclick", event => {
        if (event.target.closest("button")) return;
        coeurAnime.classList.add("go");
        setTimeout(() => coeurAnime.classList.remove("go"), 600);
        if (!aime) basculerLike();
    });
    slide.appendChild(coeurAnime);

    const info = creerElement("div", "info");
    const lienAuteur = creerElement("div", "auteur", nomPublic(publication.user_id, nomAffiche(auteurNom)));
    lienAuteur.style.pointerEvents = "auto";
    lienAuteur.style.cursor = "pointer";
    lienAuteur.addEventListener("click", () => ouvrirProfil(publication.user_id));
    info.appendChild(lienAuteur);
    if (publication.media_url && publication.contenu) info.appendChild(creerElement("div", "legende", publication.contenu));
    info.appendChild(creerElement("div", "date", formaterDate(publication.created_at)));
    slide.appendChild(info);

    const rail = creerElement("div", "rail");
    rail.append(creerAvatarAuteur(publication, auteurNom), like.b, commentaire.b, favori.b, partage.b);

    // Supprimer sa propre publication
    if (utilisateurActuel && publication.user_id === utilisateurActuel.id) {
        const sup = creerBoutonAction("corbeille", "Suppr.");
        sup.b.addEventListener("click", async () => {
            if (!confirm("Supprimer définitivement cette publication ?")) return;
            sup.b.disabled = true;
            const { data, error } = await supabaseClient.from("publications").delete()
                .eq("id", publication.id).eq("user_id", utilisateurActuel.id).select("id");
            if (error || !data || !data.length) {
                sup.b.disabled = false;
                afficherMessage("messageFil", "Suppression impossible : " + (error ? error.message : "règle de suppression manquante dans Supabase."), "erreur");
                setTimeout(() => masquerMessage("messageFil"), 4000);
                return;
            }
            slide.remove();
            afficherMessage("messageFil", "Publication supprimée.", "succes");
            setTimeout(() => masquerMessage("messageFil"), 3000);
        });
        rail.appendChild(sup.b);
    }
    // Signaler ou bloquer l'auteur d'une publication qui n'est pas la tienne
    if (utilisateurActuel && publication.user_id !== utilisateurActuel.id) {
        const plus = creerBoutonAction("plus", "Plus");
        plus.b.addEventListener("click", () => {
            const nomAuteur = nomPublic(publication.user_id, nomAffiche(auteurNom));
            ouvrirActions(nomAuteur, [
                { texte: "⚑ Signaler cette publication", agir: () => ouvrirSignalement("publication", publication.id, "Signaler cette publication de " + nomAuteur) },
                { texte: "🚫 Bloquer " + nomAuteur, danger: true, agir: async () => {
                    if (confirm("Bloquer " + nomAuteur + " ? Tu ne verras plus ses publications ni ses commentaires.")) await bloquer(publication.user_id);
                } }
            ]);
        });
        rail.appendChild(plus.b);
    }
    slide.appendChild(rail);

    commentaire.b.addEventListener("click", () => {
        pubCommentee = {
            id: publication.id,
            nb: () => nbCommentaires,
            maj: n => { nbCommentaires = n; commentaire.n.textContent = String(n); }
        };
        masquerMessage("messageFil");
        annulerReponse();
        $("champCom").value = "";
        ouvrirFeuille("feuilleCom");
        chargerCommentaires(publication.id, $("listeCom"));
    });

    partage.b.addEventListener("click", async () => {
        const adresse = new URL(window.location.href);
        adresse.hash = "publication-" + publication.id;
        const lien = adresse.href;
        const texte = publication.contenu ? publication.contenu.slice(0, 150) : "Découvre cette publication sur SELEMANI 2900 !";
        try {
            if (navigator.share) {
                await navigator.share({ title: "SELEMANI 2900", text: texte, url: lien });
            } else if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(lien);
                afficherMessage("messageFil", "Lien copié ! Partage-le avec tes amis. 🚀", "succes");
                setTimeout(() => masquerMessage("messageFil"), 3000);
            } else {
                window.prompt("Copie ce lien pour partager la publication :", lien);
            }
        } catch (error) {
            if (error.name !== "AbortError") {
                console.error("Erreur partage :", error);
                afficherMessage("messageFil", "Le partage a échoué. Réessaie.", "erreur");
            }
        }
    });

    return slide;
}

/* 12. COMMENTAIRES */
async function chargerCommentaires(publicationId, conteneur) {
    conteneur.replaceChildren(creerElement("div", "vide", "Chargement des commentaires..."));
    try {
        const { data, error } = await supabaseClient.from("commentaires")
            .select("id, user_id, contenu, created_at, parent_id")
            .eq("publication_id", publicationId)
            .order("created_at", { ascending: true }).limit(200);
        if (error) throw new Error(error.message);
        const liste = (data || []).filter(c => !bloques.has(c.user_id));
        await chargerProfils([...new Set(liste.map(c => c.user_id))]);
        conteneur.replaceChildren();
        if (!liste.length) {
            conteneur.appendChild(creerElement("div", "vide", "Aucun commentaire pour le moment. Sois le premier !"));
            return;
        }
        const racines = liste.filter(c => !c.parent_id || !liste.some(p => p.id === c.parent_id));
        racines.forEach(c => {
            conteneur.appendChild(creerCarteCommentaire(c, false, c.id));
            liste.filter(r => r.parent_id === c.id).forEach(r => {
                conteneur.appendChild(creerCarteCommentaire(r, true, c.id));
            });
        });
        conteneur.scrollTop = conteneur.scrollHeight;
    } catch (error) {
        console.error("Erreur commentaires :", error);
        conteneur.replaceChildren(creerElement("div", "vide", "Impossible de charger les commentaires : " + error.message));
    }
}

/* 13. ENVOYER UN COMMENTAIRE */
$("formCom").addEventListener("submit", async function (event) {
    event.preventDefault();
    const champ = $("champCom"), bouton = $("boutonCom");
    const texte = champ.value.trim();
    if (!utilisateurActuel || !pubCommentee || !texte) return;
    bouton.disabled = true;
    bouton.textContent = "Envoi...";
    try {
        const { error } = await supabaseClient.from("commentaires").insert([{
            publication_id: pubCommentee.id, user_id: utilisateurActuel.id, contenu: texte,
            parent_id: cibleReponse ? cibleReponse.id : null
        }]);
        if (error) throw new Error(error.message);
        champ.value = "";
        annulerReponse();
        pubCommentee.maj(pubCommentee.nb() + 1);
        await chargerCommentaires(pubCommentee.id, $("listeCom"));
    } catch (error) {
        console.error("Erreur commentaire :", error);
        afficherMessage("messageFil", "Impossible d'envoyer le commentaire : " + error.message, "erreur");
        setTimeout(() => masquerMessage("messageFil"), 4000);
    } finally {
        bouton.disabled = false;
        bouton.textContent = "Envoyer";
    }
});

/* 14. ONGLETS : Pour toi = tout le monde, Abonnés = les profils que tu suis */
function choisirOnglet(nom) {
    ongletFil = nom;
    $("ongletPourToi").classList.toggle("actif", nom === "pourtoi");
    $("ongletAbonnes").classList.toggle("actif", nom === "abonnes");
    filPublications.scrollTo({ top: 0, behavior: "smooth" });
    chargerPublications();
}
$("ongletPourToi").addEventListener("click", () => choisirOnglet("pourtoi"));
$("ongletAbonnes").addEventListener("click", () => choisirOnglet("abonnes"));

/* 15. DÉCONNEXION */
$("boutonDeconnexion").addEventListener("click", async function () {
    const bouton = this;
    bouton.disabled = true;
    bouton.textContent = "...";
    try {
        if (window.CacheSelemani) CacheSelemani.viderTout();
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw new Error(error.message);
        window.location.replace("connexion.html");
    } catch (error) {
        afficherMessage("messageFil", "Erreur de déconnexion : " + error.message, "erreur");
        bouton.disabled = false;
        bouton.textContent = "Quitter";
    }
});

/* 16. DÉMARRAGE */
async function demarrerAccueil() {
    const ok = await verifierSession();
    if (!ok) return;
    await chargerMesAbonnements();
    await chargerMesBlocagesEtFavoris();
    await chargerPublications();
    majBadgeMessages();
    majBadgeNotifs();
    if (location.hash.startsWith("#publication-")) {
        const id = decodeURIComponent(location.hash.slice(1));
        setTimeout(() => {
            const cible = $(id);
            if (cible) cible.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 200);
    }
}
demarrerAccueil();
